name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore .\SkeldForge.sln

      - name: Build
        run: dotnet build .\SkeldForge.sln -c Release --no-restore

      - name: Test
        run: dotnet test .\SkeldForge.Tests\SkeldForge.Tests.csproj -c Release --no-build --no-restore

      - name: Verify localization catalogs
        shell: pwsh
        run: |
          $base = (Get-Content .\SkeldForge\Languages\en-US.json -Raw | ConvertFrom-Json).PSObject.Properties.Name
          foreach ($file in Get-ChildItem .\SkeldForge\Languages\*.json) {
            $keys = (Get-Content $file.FullName -Raw | ConvertFrom-Json).PSObject.Properties.Name
            $missing = @($base | Where-Object { $_ -notin $keys })
            $extra = @($keys | Where-Object { $_ -notin $base })
            if ($missing.Count -or $extra.Count) {
              throw "$($file.Name): $($missing.Count) missing, $($extra.Count) extra localization keys."
            }
          }
